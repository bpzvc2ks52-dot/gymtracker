<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fitness Pro</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root { --bg: #000; --card: #1c1c1e; --card-light: #2c2c2e; --text: #fff; --muted: #8e8e93; --move: #fa114f; --stand: #00d4ff; --accent: #a2ff00; --border: #38383a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: var(--bg); color: var(--text); margin: 0 auto; padding: 16px 16px 100px 16px; max-width: 100%; overflow-x: hidden; }
  h1 { font-size: 34px; margin: 0 0 20px; font-weight: 800; letter-spacing: -1px; }
  h2 { font-size: 20px; margin: 0 0 16px; font-weight: 700; }
  button { background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
  button.secondary { background: var(--card-light); color: var(--text); }
  button.danger { background: rgba(250,17,79,0.15); color: var(--move); }
  input, select { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--card-light); color: var(--text); font-size: 16px; margin-bottom: 12px; outline: none; text-align: center; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
  .card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .muted { color: var(--muted); font-size: 14px; font-weight: 500; }
  
  /* Навигация */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28,28,30,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 20px; z-index: 9999; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; width: 20%; }
  .nav-item.active { color: var(--accent); }
  .nav-item i { font-size: 24px; }

  /* Заставка */
  .splash-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 24px; align-items: center; }
  .splash-logo { width: 90px; height: 90px; background: var(--accent); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 44px; color: #000; margin-bottom: 20px; animation: pulse 2s infinite; }
  .legal { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 20px; }
  .studio { font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  /* Тренировка */
  .set-row { display: grid; grid-template-columns: 35px 1fr 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
  .set-num { width: 35px; height: 35px; background: var(--card-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
  .set-row input { margin-bottom: 0; padding: 10px; }
  .btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 10px; background: var(--card-light); color: var(--text); border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; }

  /* Прогресс */
  .full-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
  .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; background: var(--card-light); }
  .cal-day.today { border: 2px solid var(--text); }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 2px; background: var(--accent); }
  
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: flex-end; justify-content: center; z-index: 1000; }
  .modal.active { display: flex; }
  .modal-content { background: var(--card); padding: 24px; border-radius: 24px 24px 0 0; width: 100%; max-width: 480px; text-align: center; }
</style>
</head>
<body>

<!-- Заставка -->
<div id="splash" class="splash-screen">
  <div style="margin-top: 20vh; text-align: center;">
    <div class="splash-logo"><i class="ph-bold ph-barbell"></i></div>
    <h1>Fitness Pro</h1>
    <p class="muted">Твой фитнес-трекер</p>
  </div>
  <div style="width: 100%; max-width: 400px;">
    <button onclick="startApp()">Продолжить</button>
    <p class="legal">Нажимая «Продолжить», вы соглашаетесь с обработкой персональных данных.</p>
    <p class="studio">Dikov studio</p>
  </div>
</div>

<!-- Модалки -->
<div id="food-modal" class="modal" onclick="this.classList.remove('active')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h2 style="margin-top:0">Добавить еду</h2>
    <p class="muted" style="margin-bottom:16px;">Введи название и вес (например: творог 180)</p>
    <input type="text" id="food-input" placeholder="Название и вес...">
    <button onclick="processFood()">Добавить</button>
  </div>
</div>

<!-- Навигация -->
<nav class="bottom-nav" id="nav" style="display: none;">
  <div class="nav-item" data-screen="home" onclick="go('home')"><i class="ph ph-house"></i><span>Сводка</span></div>
  <div class="nav-item" data-screen="workout" onclick="go('workout')"><i class="ph ph-barbell"></i><span>Зал</span></div>
  <div class="nav-item" data-screen="progress" onclick="go('progress')"><i class="ph ph-chart-line-up"></i><span>Тренды</span></div>
  <div class="nav-item" data-screen="profile" onclick="go('profile')"><i class="ph ph-user"></i><span>Профиль</span></div>
</nav>

<div id="app" style="display:none;"></div>

<script>
// Базы данных
const DB_EX = { 'Приседания': 'Ноги', 'Жим лёжа': 'Грудь', 'Становая': 'Спина', 'Подтягивания': 'Спина', 'Жим гантелей': 'Грудь', 'Тяга блока': 'Спина' };
const DB_FOOD = { 'творог': 180, 'курица': 165, 'яйцо': 155, 'овсянка': 350, 'банан': 89, 'рис': 344, 'шаурма': 250, 'пицца': 266, 'борщ': 50, 'котлета': 260, 'бургер': 295, 'суши': 150, 'яблоко': 52, 'кофе': 2 };

let state = {
  profile: JSON.parse(localStorage.getItem('p')) || { weight: 75, height: 180, age: 25, goal: 'mass' },
  daily: JSON.parse(localStorage.getItem('d')) || { date: new Date().toISOString().slice(0,10), calories: 0, water: 0 },
  workouts: JSON.parse(localStorage.getItem('w')) || [],
  bodyLog: JSON.parse(localStorage.getItem('b')) || [],
  currentWorkout: null,
  screen: 'home'
};

// Инициализация
function startApp() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  render();
}

function save() {
  localStorage.setItem('p', JSON.stringify(state.profile));
  localStorage.setItem('d', JSON.stringify(state.daily));
  localStorage.setItem('w', JSON.stringify(state.workouts));
  localStorage.setItem('b', JSON.stringify(state.bodyLog));
}

function getTargets() {
  const p = state.profile;
  let bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + 5;
  let cal = Math.round(bmr * 1.5 + (p.goal === 'mass' ? 400 : -400));
  return { cal, protein: Math.round(p.weight * 1.8) };
}

function render() {
  const app = document.getElementById('app');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.screen === state.screen));
  
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'workout') app.innerHTML = renderWorkout();
  else if (state.screen === 'progress') app.innerHTML = renderProgress();
  else if (state.screen === 'profile') app.innerHTML = renderProfile();
}

function renderHome() {
  const t = getTargets();
  return `
    <h1>Сводка</h1>
    <div class="card">
      <h2>Питание</h2>
      <div style="display:flex; justify-content:space-between; margin:16px 0; text-align:center;">
        <div><div style="font-size:24px; font-weight:800; color:var(--accent)">${state.daily.calories}</div><div class="muted" style="font-size:12px">/ ${t.cal} ККАЛ</div></div>
        <div><div style="font-size:24px; font-weight:800;">${t.protein}г</div><div class="muted" style="font-size:12px">БЕЛОК</div></div>
      </div>
      <button class="secondary" onclick="document.getElementById('food-modal').classList.add('active')"><i class="ph ph-fork-knife"></i> Добавить еду</button>
    </div>

    <div class="card">
      <h2>Вода</h2>
      <div style="font-size:32px; font-weight:800; text-align:center; margin:16px 0;">${state.daily.water} / 8 <span style="font-size:16px; color:var(--muted)">стаканов</span></div>
      <button class="secondary" onclick="addWater()"><i class="ph ph-drop"></i> Выпить стакан</button>
    </div>
    
    <button onclick="startWorkout()"><i class="ph ph-play"></i> Начать тренировку</button>
  `;
}

function addWater() { state.daily.water++; save(); render(); }

function processFood() {
  const input = document.getElementById('food-input').value.toLowerCase();
  let found = false;
  for (let key in DB_FOOD) {
    if (input.includes(key)) {
      const weight = input.match(/(\d+)/) ? parseInt(input.match(/(\d+)/)[1]) : 100;
      const cal = Math.round(DB_FOOD[key] * (weight / 100));
      state.daily.calories += cal;
      found = true;
      break;
    }
  }
  if(!found) alert('Продукт не найден. Попробуй: творог 180, банан 100, пицца 300.');
  else { document.getElementById('food-modal').classList.remove('active'); document.getElementById('food-input').value = ''; save(); render(); }
}

// --- ТРЕНИРОВКА ---
function startWorkout() {
  state.currentWorkout = { exercises: [] };
  state.screen = 'workout';
  render();
}

function renderWorkout() {
  if (!state.currentWorkout) startWorkout();
  const w = state.currentWorkout;
  return `
    <h1>Тренировка</h1>
    ${w.exercises.map((ex, i) => `
      <div class="card">
        <h2>${ex.name}</h2>
        ${ex.sets.map((s, j) => `
          <div class="set-row">
            <div class="set-num">${j+1}</div>
            <input type="number" value="${s.weight}" onchange="updSet(${i},${j},'weight',this.value)" placeholder="кг">
            <input type="number" value="${s.reps}" onchange="updSet(${i},${j},'reps',this.value)" placeholder="повт">
          </div>
        `).join('')}
        <button class="secondary" style="padding:8px; font-size:14px;" onclick="addSet(${i})">+ Подход</button>
      </div>
    `).join('')}
    
    <div class="card">
      <h2>Добавить упражнение</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${Object.keys(DB_EX).map(ex => `<button class="secondary" style="padding:10px; font-size:14px;" onclick="addEx('${ex}')">${ex}</button>`).join('')}
      </div>
    </div>

    ${w.exercises.length > 0 ? `<button onclick="finishWorkout()" style="background:var(--accent);"><i class="ph ph-check"></i> Завершить</button>` : ''}
    <button class="danger" onclick="cancelWorkout()">Отмена</button>
  `;
}

function addEx(name) {
  state.currentWorkout.exercises.push({ name, sets: [{ weight: 0, reps: 8 }] });
  render();
}
function addSet(i) {
  const last = state.currentWorkout.exercises[i].sets.slice(-1)[0];
  state.currentWorkout.exercises[i].sets.push({ weight: last.weight, reps: last.reps });
  render();
}
function updSet(i, j, f, v) { state.currentWorkout.exercises[i].sets[j][f] = +v; }
function cancelWorkout() { state.currentWorkout = null; state.screen = 'home'; render(); }
function finishWorkout() {
  let ton = 0;
  state.currentWorkout.exercises.forEach(ex => ex.sets.forEach(s => ton += s.weight * s.reps));
  state.workouts.push({ date: new Date().toISOString().slice(0,10), exercises: state.currentWorkout.exercises, tonnage: ton });
  state.currentWorkout = null; state.screen = 'home'; save(); render();
}

// --- ПРОГРЕСС ---
function renderProgress() {
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  
  let calHTML = '';
  for (let i = 0; i < offset; i++) calHTML += `<div></div>`;
  for (let i = 1; i <= daysInMonth; i++) {
    const dStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
    const isW = state.workouts.some(w => w.date === dStr);
    calHTML += `<div class="cal-day ${i === now.getDate() ? 'today' : ''}">${i} ${isW ? '<div class="cal-dot"></div>' : ''}</div>`;
  }

  return `
    <h1>Тренды</h1>
    <div class="card">
      <h2>Календарь тренировок</h2>
      <div class="full-calendar">
        ${['П','В','С','Ч','П','С','В'].map(d => `<div class="muted" style="font-size:12px; font-weight:700;">${d}</div>`).join('')}
        ${calHTML}
      </div>
    </div>
    <div class="card">
      <h2>Вес тела</h2>
      <div style="display:flex; gap:10px;">
        <input type="number" id="bw" placeholder="Текущий вес">
        <button class="secondary" style="width:60px; margin:0;" onclick="addWeight()">+</button>
      </div>
      <div class="muted" style="margin-top:10px;">Записей: ${state.bodyLog.length}</div>
    </div>
  `;
}

function addWeight() {
  const w = +document.getElementById('bw').value;
  if(w) { state.bodyLog.push({ date: new Date().toISOString().slice(0,10), weight: w }); save(); render(); }
}

// --- ПРОФИЛЬ ---
function renderProfile() {
  return `
    <h1>Профиль</h1>
    <div class="card">
      <h2>Данные</h2>
      <label>Вес (кг)</label>
      <input type="number" value="${state.profile.weight}" onchange="updProf('weight', this.value)">
      <label>Рост (см)</label>
      <input type="number" value="${state.profile.height}" onchange="updProf('height', this.value)">
      <label>Цель</label>
      <select onchange="updProf('goal', this.value)">
        <option value="mass" ${state.profile.goal === 'mass' ? 'selected' : ''}>Набор массы</option>
        <option value="cut" ${state.profile.goal === 'cut' ? 'selected' : ''}>Похудение</option>
      </select>
    </div>
    <div class="card">
      <h2>История тренировок</h2>
      ${state.workouts.map(w => `<div style="padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;"><span>${w.date}</span> <b>${w.tonnage} кг</b></div>`).join('') || '<p class="muted">Пока пусто</p>'}
    </div>
    <button class="danger" onclick="if(confirm('Удалить все?')) { localStorage.clear(); location.reload(); }">Сбросить данные</button>
  `;
}

function updProf(f, v) {
  state.profile[f] = f === 'goal' ? v : +v;
  save(); render();
}

function go(screen) {
  if (screen === 'workout' && !state.currentWorkout) { startWorkout(); return; }
  state.screen = screen; render(); window.scrollTo(0,0);
}

// Запуск рендера после загрузки скрипта
render();
</script>
</body>
</html>
