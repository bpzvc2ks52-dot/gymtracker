<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fitness Pro</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root { --bg: #000; --card: #1c1c1e; --card-light: #2c2c2e; --text: #fff; --muted: #8e8e93; --move: #fa114f; --exercise: #a2ff00; --stand: #00d4ff; --accent: #a2ff00; --border: #38383a; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: var(--bg); color: var(--text); margin: 0 auto; padding: 16px 16px 100px 16px; max-width: 100%; overflow-x: hidden; }
  h1 { font-size: 34px; margin: 0 0 20px; font-weight: 800; letter-spacing: -1px; }
  h2 { font-size: 20px; margin: 0 0 16px; font-weight: 700; }
  button { background: var(--accent); color: #000; border: none; padding: 16px; border-radius: 16px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 8px; }
  button.secondary { background: var(--card-light); color: var(--text); }
  button.danger { background: rgba(250,17,79,0.15); color: var(--move); }
  input, select { width: 100%; padding: 16px; border-radius: 12px; border: none; background: var(--card-light); color: var(--text); font-size: 16px; margin-bottom: 12px; outline: none; text-align: center; font-family: inherit; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; text-align: left; }
  .card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
  .muted { color: var(--muted); font-size: 14px; font-weight: 500; }
  .bento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .span-2 { grid-column: span 2; }
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(28,28,30,0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 12px 0 20px; z-index: 9999; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; width: 20%; }
  .nav-item.active { color: var(--accent); }
  .nav-item i { font-size: 24px; }
  .rings-container { display: flex; justify-content: center; gap: 20px; padding: 10px 0; }
  .ring-wrap { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
  .ring-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--card-light); stroke-width: 8; opacity: 0.3; }
  .ring-progress { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease-in-out; }
  .ring-content { z-index: 10; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .ring-icon { font-size: 18px; margin-bottom: 2px; }
  .ring-val { font-size: 12px; font-weight: 800; }
  .set-row { display: grid; grid-template-columns: 35px 1fr 1fr 40px; gap: 8px; align-items: center; margin-bottom: 8px; }
  .set-num { width: 35px; height: 35px; background: var(--card-light); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
  .set-row input { margin-bottom: 0; padding: 10px; }
  .btn-icon { width: 40px; height: 40px; padding: 0; border-radius: 10px; background: var(--card-light); color: var(--text); border: none; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(5px); }
  .modal-overlay.active { display: flex; }
  .modal-content { background: var(--card); padding: 24px; border-radius: 24px 24px 0 0; max-width: 480px; width: 100%; text-align: center; }
  .habit-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--card-light); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
  .habit-item.done { opacity: 0.5; text-decoration: line-through; }
  .habit-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); display: flex; align-items: center; justify-content: center; }
  .habit-item.done .habit-check { background: var(--accent); border-color: var(--accent); color: #000; }
  .chart-container { position:relative; height:200px; width:100%; background:var(--card-light); border-radius:16px; padding:10px; }
  .xp-container { background: var(--card-light); border-radius: 99px; height: 12px; width: 100%; overflow: hidden; margin-top: 10px; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, var(--stand), var(--accent)); border-radius: 99px; transition: width 0.5s ease; }
  .splash-screen { position: fixed; inset: 0; background: var(--bg); z-index: 10000; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 24px; align-items: center; }
  .splash-content { display: flex; flex-direction: column; align-items: center; margin-top: 25vh; text-align: center; }
  .splash-logo { width: 90px; height: 90px; background: var(--accent); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 44px; color: #000; margin-bottom: 24px; }
  .splash-footer { width: 100%; max-width: 400px; text-align: center; }
  .legal { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 20px; }
  .studio { font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 10px; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--card-light); }
  .cal-day.done { background: var(--accent); color: #000; }
  .cal-day.today { border: 2px solid var(--text); }
  @media (min-width: 768px) {
    body { max-width: 800px; }
    .bottom-nav { position: static; max-width: 600px; margin: 0 auto 30px auto; border-radius: 99px; padding: 8px; border: 1px solid var(--border); }
    .nav-item { flex-direction: row; width: auto; padding: 12px 24px; border-radius: 99px; gap: 8px; font-size: 16px; }
    .nav-item.active { background: var(--card); }
    .modal-overlay { align-items: center; }
    .modal-content { border-radius: 24px; max-width: 400px; }
  }
</style>
</head>
<body>

<div id="splash-screen" class="splash-screen">
  <div class="splash-content">
    <div class="splash-logo"><i class="ph-bold ph-barbell"></i></div>
    <h1 style="margin-bottom:8px;">Fitness Pro</h1>
    <p class="muted">Твой фитнес-трекер</p>
  </div>
  <div class="splash-footer">
    <button onclick="startApp()">Продолжить</button>
    <p class="legal">Нажимая «Продолжить», вы соглашаетесь с обработкой персональных данных.</p>
    <p class="studio">Dikov studio</p>
  </div>
</div>

<div id="food-modal" class="modal-overlay" onclick="this.classList.remove('active')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h2 style="margin-top:0">Добавить еду</h2>
    <input type="text" id="food-input" placeholder="Название и вес...">
    <button onclick="processFood()">Добавить</button>
  </div>
</div>

<div id="plan-modal" class="modal-overlay" onclick="this.classList.remove('active')">
  <div class="modal-content" onclick="event.stopPropagation()" style="text-align:left;">
    <h2 id="plan-title" style="text-align:center; color:var(--accent);">План</h2>
    <div id="plan-content" style="margin-top:20px; line-height:1.6; font-size:16px;"></div>
    <button class="secondary" style="margin-top:24px;" onclick="this.parentElement.parentElement.classList.remove('active')">Закрыть</button>
  </div>
</div>

<div id="plates-modal" class="modal-overlay" onclick="this.classList.remove('active')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h2>Блины 🥞</h2>
    <div id="plates-result" style="margin:20px 0; font-size:18px; line-height:1.6;"></div>
    <button onclick="this.parentElement.parentElement.classList.remove('active')" class="secondary">Понятно</button>
  </div>
</div>

<nav class="bottom-nav" id="nav" style="display: none;">
  <div class="nav-item" data-screen="home" onclick="go('home')"><i class="ph ph-house"></i><span>Сводка</span></div>
  <div class="nav-item" data-screen="workout" onclick="go('workout')"><i class="ph ph-barbell"></i><span>Зал</span></div>
  <div class="nav-item" data-screen="running" onclick="go('running')"><i class="ph ph-figure-run"></i><span>Бег</span></div>
  <div class="nav-item" data-screen="progress" onclick="go('progress')"><i class="ph ph-chart-line-up"></i><span>Тренды</span></div>
  <div class="nav-item" data-screen="profile" onclick="go('profile')"><i class="ph ph-user"></i><span>Профиль</span></div>
</nav>

<div id="app" style="display:none;"></div>
<div id="export-area"></div>
<div id="report-area"></div>

<script>
  // БАЗА ДАННЫХ ПРОДУКТОВ (ОГРОМНАЯ)
const FOOD_DB = {
  'курица': 165, 'грудка': 165, 'индейка': 150, 'говядина': 250, 'свинина': 260, 'рыба': 120, 'лосось': 208, 'тунец': 130, 'треска': 82,
  'творог': 180, 'яйцо': 155, 'сыр': 350, 'молоко': 52, 'йогурт': 60, 'кефир': 40,
  'рис': 344, 'гречка': 343, 'макароны': 350, 'овсянка': 350, 'картофель': 77, 'пюре': 100, 'хлеб': 265,
  'шаурма': 250, 'бургер': 295, 'чизбургер': 320, 'фри': 312, 'пицца': 266, 'хот-дог': 290, 'наггетсы': 296, 'суши': 150, 'роллы': 180,
  'борщ': 50, 'суп': 40, 'котлета': 260, 'пельмени': 275, 'омлет': 150, 'блины': 230, 'сырники': 220, 'салат': 80,
  'банан': 89, 'яблоко': 52, 'апельсин': 47, 'огурец': 15, 'помидор': 18, 'авокадо': 160,
  'шоколад': 546, 'печенье': 450, 'орехи': 600, 'чипсы': 536, 'кофе': 2, 'чай': 1, 'сок': 45, 'кола': 42
};

const EX_DB = { 'Приседания': 'Ноги', 'Жим лёжа': 'Грудь', 'Становая': 'Спина', 'Подтягивания': 'Спина', 'Жим гантелей': 'Грудь', 'Тяга блока': 'Спина' };

let state = {
  profile: JSON.parse(localStorage.getItem('p')) || { weight: 75, height: 180, age: 25, goal: 'mass', xp: 0, level: 1 },
  daily: JSON.parse(localStorage.getItem('d')) || { date: new Date().toISOString().slice(0,10), calories: 0, water: 0, habits: { water: false, steps: false, sleep: false } },
  workouts: JSON.parse(localStorage.getItem('w')) || [],
  bodyLog: JSON.parse(localStorage.getItem('b')) || [],
  measurements: JSON.parse(localStorage.getItem('m')) || [],
  runs: JSON.parse(localStorage.getItem('r')) || [],
  currentWorkout: null,
  screen: 'home',
  chart: null
};

let runInt = null, runTime = 0, runActive = false, gpsWatchId = null, lastPos = null, gpsDistance = 0;

function save() {
  localStorage.setItem('p', JSON.stringify(state.profile));
  localStorage.setItem('d', JSON.stringify(state.daily));
  localStorage.setItem('w', JSON.stringify(state.workouts));
  localStorage.setItem('b', JSON.stringify(state.bodyLog));
  localStorage.setItem('m', JSON.stringify(state.measurements));
  localStorage.setItem('r', JSON.stringify(state.runs));
}

function today() { return new Date().toISOString().slice(0, 10); }

if (state.daily.date !== today()) { 
  state.daily = { date: today(), calories: 0, water: 0, habits: { water: false, steps: false, sleep: false } }; 
  save(); 
}

function startApp() {
  document.getElementById('splash-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  render();
}

function getTargets() {
  const p = state.profile;
  let bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + 5;
  let cal = Math.round(bmr * 1.5 + (p.goal === 'mass' ? 400 : -400));
  return { cal, protein: Math.round(p.weight * 1.8) };
}

function addXP(amount) {
  state.profile.xp = (state.profile.xp || 0) + amount;
  state.profile.level = Math.floor(state.profile.xp / 500) + 1;
  save();
}

function render() {
  const app = document.getElementById('app');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.screen === state.screen));
  
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'workout') app.innerHTML = renderWorkout();
  else if (state.screen === 'running') app.innerHTML = renderRunning();
  else if (state.screen === 'progress') app.innerHTML = renderProgress();
  else if (state.screen === 'profile') app.innerHTML = renderProfile();
}

function renderHome() {
  const t = getTargets();
  const done = state.workouts.some(w => w.date === today());
  const waterPct = Math.min((state.daily.water / 8) * 100, 100);
  const wPct = done ? 100 : 0;
  const size = 90, stroke = 8, r = (size-stroke)/2, circ = 2*Math.PI*r;

  return `
    <h1>Сводка</h1>
    <div class="bento-grid">
      <div class="card span-2" style="padding: 30px 15px;">
        <div class="rings-container">
          <div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 90 90"><circle class="ring-bg" cx="45" cy="45" r="${r}"></circle><circle class="ring-progress" cx="45" cy="45" r="${r}" style="stroke:var(--exercise); stroke-dasharray:${circ}; stroke-dashoffset:${circ - (wPct/100)*circ};"></circle></svg><div class="ring-content"><i class="ph ph-barbell ring-icon" style="color:var(--exercise)"></i><span class="ring-val">${done ? '100%' : '0%'}</span></div></div>
          <div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 90 90"><circle class="ring-bg" cx="45" cy="45" r="${r}"></circle><circle class="ring-progress" cx="45" cy="45" r="${r}" style="stroke:var(--stand); stroke-dasharray:${circ}; stroke-dashoffset:${circ - (waterPct/100)*circ};"></circle></svg><div class="ring-content"><i class="ph ph-drop ring-icon" style="color:var(--stand)"></i><span class="ring-val">${state.daily.water}/8</span></div></div>
        </div>
        <div style="background:var(--card-light); padding:16px; border-radius:16px; margin-top:20px; display:flex; justify-content:space-between; text-align:center;">
          <div><div style="font-size:18px; font-weight:800; color:var(--accent);">${state.daily.calories}</div><div class="muted" style="font-size:11px;">/ ${t.cal} ККАЛ</div></div>
          <div><div style="font-size:18px; font-weight:800;">${t.protein}</div><div class="muted" style="font-size:11px;">БЕЛОК (г)</div></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">
          <button class="secondary" onclick="addWater()" style="margin:0; font-size:14px; padding:14px;"><i class="ph ph-plus"></i> Вода</button>
          <button class="secondary" onclick="document.getElementById('food-modal').classList.add('active')" style="margin:0; font-size:14px; padding:14px;"><i class="ph ph-fork-knife"></i> Еда</button>
        </div>
      </div>
      
      <div class="card" style="min-height:160px;">
        <h2 style="margin-bottom:10px;">План тренировок</h2>
        <p class="muted">Программа на неделю</p>
        <button style="margin-top:20px;" onclick="showTrainingPlan()">Смотреть план</button>
      </div>

      <div class="card" style="min-height:160px;">
        <h2 style="margin-bottom:10px;">План питания</h2>
        <p class="muted">Меню под твою цель</p>
        <button style="margin-top:20px;" onclick="showNutritionPlan()">Смотреть меню</button>
      </div>

      <div class="card span-2">
        <h2 style="margin-bottom:16px;"><i class="ph ph-check-square-offset"></i> Привычки на сегодня</h2>
        <div class="habit-item ${state.daily.habits.water ? 'done' : ''}" onclick="toggleHabit('water')"><span><i class="ph ph-drop" style="color:var(--stand)"></i> Выпить 2л воды</span><div class="habit-check">${state.daily.habits.water ? '<i class="ph-bold ph-check"></i>' : ''}</div></div>
        <div class="habit-item ${state.daily.habits.steps ? 'done' : ''}" onclick="toggleHabit('steps')"><span><i class="ph ph-sneaker" style="color:var(--move)"></i> Пройти 10 000 шагов</span><div class="habit-check">${state.daily.habits.steps ? '<i class="ph-bold ph-check"></i>' : ''}</div></div>
        <div class="habit-item ${state.daily.habits.sleep ? 'done' : ''}" onclick="toggleHabit('sleep')"><span><i class="ph ph-moon" style="color:var(--purple)"></i> Спать 8 часов</span><div class="habit-check">${state.daily.habits.sleep ? '<i class="ph-bold ph-check"></i>' : ''}</div></div>
      </div>
      
      <div class="card span-2">
        <button onclick="startWorkout()" style="margin:0;"><i class="ph ph-play"></i> Начать тренировку</button>
      </div>
    </div>
  `;
}

function showTrainingPlan() {
  const goal = state.profile.goal;
  let content = goal === 'mass' 
    ? `<h2 style="color:var(--accent);">Набор массы</h2><div style="text-align:left; line-height:1.6;"><div style="margin-bottom:16px;"><b>День 1: Верх (Push)</b><br><span class="muted">Жим лёжа 4х8, Жим гантелей 3х10, Махи 3х15</span></div><div style="margin-bottom:16px;"><b>День 2: Низ</b><br><span class="muted">Приседания 4х8, Жим ногами 3х10, Выпады 3х12</span></div><div><b>День 3: Верх (Pull)</b><br><span class="muted">Становая 3х6, Подтягивания 4хмакс, Тяга блока 3х10</span></div></div>` 
    : `<h2 style="color:var(--accent);">Похудение</h2><div style="text-align:left; line-height:1.6;"><div style="margin-bottom:16px;"><b>Круговая (3 круга)</b><br><span class="muted">Приседания 15, Отжимания 10, Выпады 12, Планка 30с</span></div><div><b>Кардио</b><br><span class="muted">30 мин бега или ходьбы</span></div></div>`;
  document.getElementById('plan-title').innerText = "План тренировок";
  document.getElementById('plan-content').innerHTML = content;
  document.getElementById('plan-modal').classList.add('active');
}

function showNutritionPlan() {
  const goal = state.profile.goal;
  const t = getTargets();
  let meals = goal === 'mass' 
    ? `<div><b>Завтрак:</b> Овсянка + яйца</div><div><b>Обед:</b> Гречка + Курица</div><div><b>Ужин:</b> Рыба + рис</div>`
    : `<div><b>Завтрак:</b> Омлет + шпинат</div><div><b>Обед:</b> Грудка + салат</div><div><b>Ужин:</b> Треска + брокколи</div>`;
  document.getElementById('plan-title').innerText = "План питания";
  document.getElementById('plan-content').innerHTML = `<div style="background:var(--card-light); padding:16px; border-radius:16px; margin-bottom:20px;"><b>Норма:</b> ${t.cal} ккал / ${t.protein}г белка</div>${meals}`;
  document.getElementById('plan-modal').classList.add('active');
}

function toggleHabit(h) { state.daily.habits[h] = !state.daily.habits[h]; addXP(10); save(); render(); }
function addWater() { state.daily.water = Math.min((state.daily.water || 0) + 1, 8); save(); render(); }

function processFood() {
  const input = document.getElementById('food-input').value.toLowerCase().trim();
  if(!input) return;
  let found = null;
  for (let key in FOOD_DB) { if (input.includes(key)) { found = key; break; } }
  if (found) {
    const weight = input.match(/(\d+)/) ? parseInt(input.match(/(\d+)/)[1]) : 100;
    state.daily.calories += Math.round(FOOD_DB[found] * (weight / 100));
    addXP(10); save(); document.getElementById('food-modal').classList.remove('active'); render();
  } else {
    let manualCal = prompt(`Продукт "${input}" не найден в базе. Введи калории на 100г:`);
    if (manualCal && !isNaN(manualCal)) {
      const weight = input.match(/(\d+)/) ? parseInt(input.match(/(\d+)/)[1]) : 100;
      state.daily.calories += Math.round(manualCal * (weight / 100));
      addXP(10); save(); document.getElementById('food-modal').classList.remove('active'); render();
    }
  }
}

function startWorkout() { state.currentWorkout = { date: today(), exercises: [] }; state.screen = 'workout'; render(); }

function renderWorkout() {
  if (!state.currentWorkout) startWorkout();
  const w = state.currentWorkout;
  return `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="margin:0;">Зал</h1>
      <button class="danger" style="width:auto; padding:10px 20px; margin:0; border-radius:99px;" onclick="state.currentWorkout=null; go('home')">Отмена</button>
    </div>
    ${w.exercises.map((ex, i) => `
      <div class="card">
        <h2>${ex.name}</h2>
        ${ex.sets.map((s, j) => `
          <div class="set-row">
            <div class="set-num">${j+1}</div>
            <input type="number" value="${s.weight}" onchange="updSet(${i},${j},'weight',this.value)" placeholder="кг">
            <input type="number" value="${s.reps}" onchange="updSet(${i},${j},'reps',this.value)" placeholder="повт">
            <button class="btn-icon" onclick="showPlates(${s.weight})"><i class="ph ph-cookie"></i></button>
          </div>
        `).join('')}
        <button class="secondary" style="padding:8px; font-size:14px;" onclick="addSet(${i})">+ Подход</button>
      </div>
    `).join('')}
    
    <div class="card">
      <h2>Упражнения</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${Object.keys(EX_DB).map(ex => `<button class="secondary" style="padding:10px; font-size:14px;" onclick="addEx('${ex}')">${ex}</button>`).join('')}
      </div>
    </div>

    ${w.exercises.length > 0 ? `<button onclick="finishWorkout()"><i class="ph ph-check"></i> Завершить</button>` : ''}
  `;
}

function addEx(name) { state.currentWorkout.exercises.push({ name, sets: [{ weight: 0, reps: 8 }] }); render(); }
function addSet(i) { const l = state.currentWorkout.exercises[i].sets.slice(-1)[0]; state.currentWorkout.exercises[i].sets.push({ weight: l.weight, reps: l.reps }); render(); }
function updSet(i, j, f, v) { state.currentWorkout.exercises[i].sets[j][f] = +v; }
function finishWorkout() {
  let ton = 0;
  state.currentWorkout.exercises.forEach(ex => ex.sets.forEach(s => ton += s.weight * s.reps));
  state.workouts.push({ ...state.currentWorkout, id: Date.now(), tonnage: ton });
  addXP(100); save(); state.currentWorkout = null; state.screen = 'home'; render();
}

function showPlates(w) {
  if (w <= 20) return alert('Гриф');
  let target = (w - 20) / 2, res = [];
  [25, 20, 15, 10, 5, 2.5, 1.25].forEach(p => { let c = Math.floor(target / p); if (c > 0) { res.push(`${c} × ${p} кг`); target -= c * p; } });
  document.getElementById('plates-result').innerHTML = res.join('<br>') || 'Гриф';
  document.getElementById('plates-modal').classList.add('active');
}

function renderRunning() {
  const cal = Math.round(9.8 * state.profile.weight * (runTime / 3600)); 
  const paceMin = runTime > 0 && gpsDistance > 0 ? (runTime / 60) / gpsDistance : 0;
  const paceStr = paceMin > 0 ? `${Math.floor(paceMin)}:${Math.round((paceMin%1)*60).toString().padStart(2,'0')}` : '0:00';
  
  return `
    <div style="text-align:center; padding-top:40px;">
      <h1>Бег</h1>
      <div style="font-size:64px; font-weight:800; margin:20px 0;" id="run-time">${formatTime(runTime)}</div>
      <div style="display:flex; justify-content:space-around; margin-bottom:40px;">
        <div><div style="font-size:24px; font-weight:800; color:var(--accent);" id="run-dist">${gpsDistance.toFixed(2)}</div><div class="muted">КМ</div></div>
        <div><div style="font-size:24px; font-weight:800; color:var(--stand);" id="run-pace">${paceStr}</div><div class="muted">ТЕМП</div></div>
        <div><div style="font-size:24px; font-weight:800; color:var(--move);" id="run-cal">${cal}</div><div class="muted">ККАЛ</div></div>
      </div>
      <button onclick="toggleRun()" id="run-btn" style="border-radius:99px; padding:24px; font-size:22px; background:${runActive ? 'var(--move)' : 'var(--accent)'}; color:${runActive ? '#fff' : '#000'};">
        <i class="ph ${runActive ? 'ph-pause' : 'ph-play'}"></i> ${runActive ? 'ПАУЗА' : 'СТАРТ'}
      </button>
    </div>
  `;
}

function formatTime(sec) { return `${Math.floor(sec/3600).toString().padStart(2,'0')}:${Math.floor((sec%3600)/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; }
function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
  const R = 6371; const dLat = (lat2 - lat1) * (Math.PI / 180); const dLon = (lon2 - lon1) * (Math.PI / 180);
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*(Math.PI/180)) * Math.cos(lat2*(Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function toggleRun() {
  runActive = !runActive;
  if(runActive) {
    runInt = setInterval(() => { runTime++; document.getElementById('run-time').innerText = formatTime(runTime); updateRunUI(); }, 1000);
    if (navigator.geolocation) { gpsWatchId = navigator.geolocation.watchPosition((pos) => { const { latitude, longitude } = pos.coords; if (lastPos) { const dist = getDistanceFromLatLonInKm(lastPos.lat, lastPos.lon, latitude, longitude); if (dist > 0.003) { gpsDistance += dist; lastPos = { lat: latitude, lon: longitude }; updateRunUI(); } } else { lastPos = { lat: latitude, lon: longitude }; } }, (err) => {}, { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }); }
  } else { clearInterval(runInt); if (gpsWatchId) navigator.geolocation.clearWatch(gpsWatchId); }
  document.getElementById('app').innerHTML = renderRunning();
}

function updateRunUI() {
  const elTime = document.getElementById('run-time'), elDist = document.getElementById('run-dist'), elCal = document.getElementById('run-cal'), elPace = document.getElementById('run-pace');
  if(elTime) elTime.innerText = formatTime(runTime); if(elDist) elDist.innerText = gpsDistance.toFixed(2);
  const cal = Math.round(9.8 * state.profile.weight * (runTime / 3600)); if(elCal) elCal.innerText = cal;
  if (runTime > 0 && gpsDistance > 0) { const paceMin = (runTime / 60) / gpsDistance; if(elPace) elPace.innerText = `${Math.floor(paceMin)}:${Math.round((paceMin%1)*60).toString().padStart(2,'0')}`; }
}

function renderProgress() {
  setTimeout(drawChart, 50);
  let delta = '';
  if (state.bodyLog.length > 1) {
    const s = [...state.bodyLog].sort((a,b)=>a.date.localeCompare(b.date));
    const diff = s[s.length-1].weight - s[s.length-2].weight;
    delta = diff > 0 ? `<span style="color:var(--move)">+${diff.toFixed(1)} кг</span>` : `<span style="color:var(--accent)">${diff.toFixed(1)} кг</span>`;
  }

  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  let calHTML = '';
  for (let i = 0; i < offset; i++) calHTML += `<div></div>`;
  for (let i = 1; i <= daysInMonth; i++) {
    const dStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
    const isW = state.workouts.some(w => w.date === dStr);
    calHTML += `<div class="cal-day ${isW ? 'done' : ''} ${i === now.getDate() ? 'today' : ''}">${i}</div>`;
  }

  return `
    <h1>Тренды</h1>
    <div class="bento-grid">
      <div class="card span-2">
        <h2>Календарь тренировок</h2>
        <div class="calendar-grid">
          ${['П','В','С','Ч','П','С','В'].map(d => `<div class="muted" style="font-size:11px; font-weight:700;">${d}</div>`).join('')}
          ${calHTML}
        </div>
      </div>
      
      <div class="card span-2">
        <h2>Вес тела ${delta}</h2>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
          <input type="number" id="bw" placeholder="Вес (кг)" style="margin:0;">
          <button style="width:50px; margin:0; padding:0;" onclick="addWeight()"><i class="ph ph-plus"></i></button>
        </div>
        <div class="chart-container"><canvas id="wChart"></canvas></div>
      </div>

      <div class="card span-2">
        <h2>Замеры тела</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
          <div><label>Грудь</label><input type="number" id="m_chest" placeholder="см"></div>
          <div><label>Талия</label><input type="number" id="m_waist" placeholder="см"></div>
          <div><label>Бицепс</label><input type="number" id="m_bicep" placeholder="см"></div>
          <div><label>Бедро</label><input type="number" id="m_thigh" placeholder="см"></div>
        </div>
        <button class="secondary" onclick="saveMeasurements()">Сохранить замеры</button>
        <div style="margin-top:20px;">
          ${state.measurements.length > 0 ? `<div style="font-size:14px; font-weight:700; margin-bottom:8px;">История:</div>` : ''}
          ${state.measurements.map(m => `<div style="font-size:14px; border-bottom:1px solid var(--border); padding:8px 0; display:flex; justify-content:space-between;"><span>${m.date}</span><span>Г:${m.chest||'-'} Т:${m.waist||'-'} Б:${m.bicep||'-'} Бд:${m.thigh||'-'}</span></div>`).join('')}
        </div>
      </div>
    </div>
  `;
}

function saveMeasurements() {
  const m = {
    date: today(),
    chest: +document.getElementById('m_chest').value || null,
    waist: +document.getElementById('m_waist').value || null,
    bicep: +document.getElementById('m_bicep').value || null,
    thigh: +document.getElementById('m_thigh').value || null
  };
  if (!m.chest && !m.waist && !m.bicep && !m.thigh) return alert('Введи хотя бы один замер');
  state.measurements.push(m);
  addXP(20); save(); render();
}

function drawChart() {
  const ctx = document.getElementById('wChart'); if(!ctx) return;
  if (state.chart) state.chart.destroy();
  const s = [...state.bodyLog].sort((a,b)=>a.date.localeCompare(b.date));
  state.chart = new Chart(ctx, {
    type: 'line',
    data: { labels: s.map(x=>x.date.slice(5)), datasets: [{ data: s.map(x=>x.weight), borderColor: '#a2ff00', backgroundColor: 'rgba(162,255,0,0.1)', fill: true, tension: 0.4 }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
  });
}

function addWeight() {
  const w = +document.getElementById('bw').value;
  if(w) { state.bodyLog.push({ date: today(), weight: w }); addXP(20); save(); render(); }
}

function renderProfile() {
  return `
    <h1>Профиль</h1>
    <div class="card" style="text-align:center; padding:30px;">
      <div style="width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg, var(--move), var(--accent)); display:flex; align-items:center; justify-content:center; font-size:36px; color:#fff; margin:0 auto 20px;"><i class="ph ph-user"></i></div>
      <h2 style="margin:0;">Атлет <span style="color:var(--accent); font-size:16px;">Ур. ${state.profile.level}</span></h2>
      <div class="xp-container"><div class="xp-fill" style="width: ${(state.profile.xp % 500) / 5}%;"></div></div>
      <p class="muted" style="margin-top:8px;">XP: ${state.profile.xp}</p>
    </div>
    <div class="card">
      <label>Цель</label>
      <select onchange="state.profile.goal = this.value; save(); render();">
        <option value="mass" ${state.profile.goal === 'mass' ? 'selected' : ''}>Набор массы</option>
        <option value="cut" ${state.profile.goal === 'cut' ? 'selected' : ''}>Похудение</option>
      </select>
    </div>
    <button class="danger" onclick="if(confirm('Удалить все данные?')) { localStorage.clear(); location.reload(); }">Сбросить данные</button>
  `;
}

function go(screen) {
  if (screen === 'workout' && !state.currentWorkout) { startWorkout(); return; }
  state.screen = screen; render(); window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
