<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fitness Pro</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #000000; --card: #1c1c1e; --card-light: #2c2c2e;
    --text: #ffffff; --muted: #8e8e93;
    --move: #fa114f; --exercise: #a2ff00; --stand: #00d4ff; --accent: #a2ff00;
    --radius: 28px; --border: #38383a; --nav-bg: rgba(28,28,30,0.9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); margin: 0 auto; padding: 16px 16px 110px 16px; 
    max-width: 100%; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  
  h1 { font-size: 36px; margin: 0 0 20px; font-weight: 800; letter-spacing: -1px; }
  h2 { font-size: 22px; margin: 0 0 16px; font-weight: 700; letter-spacing: -0.5px; }
  
  button { background: var(--accent); color: #000; border: none; padding: 18px; border-radius: 20px; 
    font-size: 18px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 12px; 
    display: flex; justify-content: center; align-items: center; gap: 10px; transition: opacity 0.2s, transform 0.1s; }
  button:active { opacity: 0.7; transform: scale(0.98); }
  button.secondary { background: var(--card-light); color: var(--text); }
  button.danger { background: rgba(250,17,79,0.15); color: var(--move); }
  
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input, select { width: 100%; padding: 18px; border-radius: 16px; border: none; 
    background: var(--card-light); color: var(--text); font-size: 17px; margin-bottom: 12px; outline: none; 
    font-family: inherit; font-weight: 600; transition: box-shadow 0.2s; text-align: center; }
  input:focus { box-shadow: 0 0 0 3px var(--accent); }
  
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding-left: 4px;}
  
  .bento-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 24px; 
          box-shadow: 0 4px 20px rgba(0,0,0,0.2); overflow: hidden; position: relative; }
  
  .muted { color: var(--muted); font-size: 15px; font-weight: 500; }
  .stat-num { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -1.5px; }
  .stat-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border); display: flex; justify-content: space-around;
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 100; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; transition: color 0.2s; width: 20%; }
  .nav-item.active { color: var(--text); }
  .nav-item.active i { color: var(--accent); }
  .nav-item i { font-size: 26px; }

  .rings-container { display: flex; justify-content: center; gap: 20px; padding: 10px 0; }
  .ring-wrap { position: relative; width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; }
  .ring-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--card-light); stroke-width: 10; opacity: 0.3; }
  .ring-progress { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 1s ease-in-out; }
  .ring-content { z-index: 10; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .ring-icon { font-size: 20px; margin-bottom: 2px; }
  .ring-val { font-size: 14px; font-weight: 800; }

  .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 44px; gap: 10px; align-items: center; margin-bottom: 12px; }
  .set-num { width: 40px; height: 40px; background: var(--card-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--muted); }
  .set-row input { margin-bottom: 0; padding: 14px; font-size: 17px; border-radius: 12px; text-align: center; font-weight: 700; }
  .set-row.warmup .set-num { color: var(--move); }
  .set-row.warmup input { color: var(--move); }
  .btn-icon { width: 44px; height: 44px; padding: 0; border-radius: 12px; background: var(--card-light); color: var(--text); border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; }

  /* Календарь */
  .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .cal-day { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 14px; font-weight: 600; color: var(--muted); }
  .cal-day.done { background: var(--accent); color: #000; font-weight: 800; }
  .cal-day.today { border: 2px solid var(--text); }

  .run-screen { display: flex; flex-direction: column; height: calc(100vh - 160px); justify-content: center; }
  .run-time-big { font-size: 70px; font-weight: 800; line-height: 1; letter-spacing: -3px; font-variant-numeric: tabular-nums; text-align: center; margin-bottom: 20px; }
  .run-metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
  .run-metric-box { background: var(--card); padding: 24px; border-radius: var(--radius); text-align: center; }
  .run-metric-val { font-size: 32px; font-weight: 800; color: var(--exercise); line-height: 1; margin-bottom: 4px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(10px); }
  .modal-overlay.active { display: flex; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-content { background: var(--card); padding: 32px 24px; border-radius: 32px 32px 0 0; max-width: 480px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto;}

  .mood-btn { font-size: 36px; background: var(--card-light); border-radius: 16px; padding: 10px; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
  .mood-btn.selected { border-color: var(--accent); background: rgba(162,255,0,0.1); }

  @media (min-width: 768px) {
    body { max-width: 900px; padding: 24px 24px 40px 24px; }
    .bottom-nav { position: static; max-width: 700px; margin: 0 auto 30px auto; border-radius: 99px; border: 1px solid var(--border); padding: 8px; }
    .nav-item { flex-direction: row; width: auto; padding: 14px 28px; border-radius: 99px; font-size: 16px; gap: 10px; }
    .nav-item.active { background: var(--card); }
    .bento-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
    .span-2 { grid-column: span 2; }
    .modal-overlay { align-items: center; }
    .modal-content { border-radius: 32px; max-width: 450px; }
    .run-time-big { font-size: 110px; }
    .workout-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  }
</style>
</head>
<body>

<!-- Модалка Оценки Тренировки -->
<div id="feedback-modal" class="modal-overlay">
  <div class="modal-content">
    <h2 style="margin-top:0">Как прошла тренировка?</h2>
    <p class="muted" style="margin-bottom:20px;">Это поможет отслеживать твое состояние</p>
    
    <div style="display:flex; justify-content:center; gap:10px; margin-bottom:20px;" id="mood-container">
      <div class="mood-btn" onclick="selectMood('🔥')">🔥</div>
      <div class="mood-btn" onclick="selectMood('💪')">💪</div>
      <div class="mood-btn" onclick="selectMood('🥵')">🥵</div>
      <div class="mood-btn" onclick="selectMood('😴')">😴</div>
    </div>

    <input type="text" id="workout-note" placeholder="Заметка (например: болела спина)" style="text-align:left;">
    
    <button onclick="saveWorkoutWithFeedback()" style="margin-top:10px;">Сохранить тренировку</button>
  </div>
</div>

<!-- Модалка Планов -->
<div id="plan-modal" class="modal-overlay" onclick="closeModal('plan-modal')">
  <div class="modal-content" onclick="event.stopPropagation()" style="text-align:left;">
    <h2 id="plan-title" style="text-align:center; color:var(--accent);">План</h2>
    <div id="plan-content" style="margin-top:20px; line-height:1.6; font-size:16px;"></div>
    <button class="secondary" style="margin-top:24px;" onclick="closeModal('plan-modal')">Закрыть</button>
  </div>
</div>

<!-- Модалка Деталей Истории -->
<div id="history-modal" class="modal-overlay" onclick="closeModal('history-modal')">
  <div class="modal-content" onclick="event.stopPropagation()" style="text-align:left;">
    <h2 id="history-title" style="text-align:center;">Детали тренировки</h2>
    <div id="history-content" style="margin-top:20px;"></div>
    <button class="secondary" style="margin-top:24px;" onclick="closeModal('history-modal')">Закрыть</button>
  </div>
</div>

<!-- Модалка Замеров -->
<div id="measure-modal" class="modal-overlay" onclick="closeModal('measure-modal')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h2 style="margin-top:0">Замеры тела (см)</h2>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px;">
      <div><label>Грудь</label><input type="number" id="m_chest" placeholder="0"></div>
      <div><label>Талия</label><input type="number" id="m_waist" placeholder="0"></div>
      <div><label>Бицепс</label><input type="number" id="m_bicep" placeholder="0"></div>
      <div><label>Бедро</label><input type="number" id="m_thigh" placeholder="0"></div>
    </div>
    <button onclick="saveMeasurements()">Сохранить</button>
  </div>
</div>

<!-- Модалка Таймера -->
<div id="timer-modal" class="modal-overlay" onclick="closeModal('timer-modal')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <div id="timer-display" style="font-size:72px; font-weight:800; font-variant-numeric:tabular-nums; margin:20px 0; color:var(--accent);">01:30</div>
    <button onclick="closeModal('timer-modal')" class="secondary">Закрыть</button>
  </div>
</div>

<!-- Модалка Блинов -->
<div id="plates-modal" class="modal-overlay" onclick="closeModal('plates-modal')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h2 style="margin-top:0">Блины 🥞</h2>
    <div id="plates-result" style="margin:24px 0; font-size:20px; line-height:1.8; font-weight:600;"></div>
    <button onclick="closeModal('plates-modal')" class="secondary">Понятно</button>
  </div>
</div>

<nav class="bottom-nav" id="nav">
  <div class="nav-item" data-screen="home" onclick="go('home')"><i class="ph ph-house"></i><span>Сводка</span></div>
  <div class="nav-item" data-screen="newWorkout" onclick="go('newWorkout')"><i class="ph ph-barbell"></i><span>Зал</span></div>
  <div class="nav-item" data-screen="running" onclick="go('running')"><i class="ph ph-figure-run"></i><span>Бег</span></div>
  <div class="nav-item" data-screen="progress" onclick="go('progress')"><i class="ph ph-chart-line-up"></i><span>Тренды</span></div>
  <div class="nav-item" data-screen="profile" onclick="go('profile')"><i class="ph ph-user"></i><span>Профиль</span></div>
</nav>

<div id="app"></div>

<script>
const STORAGE = { profile: 'fit_p4', workouts: 'fit_w4', bodyLog: 'fit_b4', daily: 'fit_d4', runs: 'fit_r4', measurements: 'fit_m4' };

const EXERCISE_DB = {
  'Приседания со штангой': 'Ноги', 'Жим лёжа': 'Грудь', 'Становая тяга': 'Спина', 
  'Жим стоя': 'Плечи', 'Подтягивания': 'Спина', 'Тяга штанги в наклоне': 'Спина', 
  'Жим гантелей лёжа': 'Грудь', 'Тяга верхнего блока': 'Спина', 'Жим ногами': 'Ноги', 
  'Выпады с гантелями': 'Ноги', 'Подъём штанги на бицепс': 'Руки', 'Французский жим': 'Руки'
};
const BASE_EXERCISES = Object.keys(EXERCISE_DB);

const TEMPLATES = {
  'Full Body': ['Приседания со штангой', 'Жим лёжа', 'Тяга штанги в наклоне'],
  'Верх тела': ['Жим лёжа', 'Подтягивания', 'Махи гантелями в стороны', 'Подъём штанги на бицепс'],
  'Низ тела': ['Приседания со штангой', 'Становая тяга', 'Жим ногами', 'Выпады с гантелями']
};

let state = {
  profile: load(STORAGE.profile), 
  workouts: load(STORAGE.workouts) || [], 
  bodyLog: load(STORAGE.bodyLog) || [],
  runs: load(STORAGE.runs) || [],
  measurements: load(STORAGE.measurements) || [],
  daily: load(STORAGE.daily) || { date: today(), water: 0, calories: 0 },
  screen: 'home', currentWorkout: null, chartInstance: null,
  tempMood: null
};

let timerInt = null, timerTime = 90;
let runInt = null, runTime = 0, runActive = false;

function load(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } }
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
function today() { return new Date().toISOString().slice(0, 10); }

if (state.daily.date !== today()) { state.daily = { date: today(), water: 0, calories: 0 }; save(STORAGE.daily, state.daily); }

// --- МАТЕМАТИКА ---
function calcTonnage(workout) {
  if (!workout || !workout.exercises) return 0;
  return workout.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => !s.isWarmup).reduce((sSum, s) => sSum + (s.weight * s.reps), 0), 0);
}

function calcBodyFat(profile) {
  if (!profile || !profile.weight || !profile.height || !profile.age) return 0;
  const bmi = profile.weight / Math.pow(profile.height / 100, 2);
  const sex = profile.sex === 'male' ? 1 : 0;
  let fat = (1.20 * bmi) + (0.23 * profile.age) - (10.8 * sex) - 5.4;
  return Math.max(3, Math.min(50, Math.round(fat)));
}

function calcRecovery() {
  if (state.workouts.length === 0) return 100;
  const last = [...state.workouts].sort((a,b) => b.date.localeCompare(a.date))[0];
  const daysSince = Math.floor((new Date(today()) - new Date(last.date)) / (1000 * 60 * 60 * 24));
  if (daysSince >= 2) return 100;
  if (daysSince === 1) return last.tonnage > 5000 ? 50 : 70;
  return 30;
}

// Получение личных рекордов (PR)
function getPRs() {
  let prs = { 'Жим лёжа': 0, 'Приседания со штангой': 0, 'Становая тяга': 0 };
  state.workouts.forEach(w => {
    w.exercises.forEach(ex => {
      if (prs[ex.name] !== undefined) {
        const maxWeight = Math.max(...ex.sets.filter(s => !s.isWarmup).map(s => s.weight), 0);
        if (maxWeight > prs[ex.name]) prs[ex.name] = maxWeight;
      }
    });
  });
  return prs;
}

// --- РЕНДЕР ---
function render() {
  const app = document.getElementById('app');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.screen === state.screen));
  
  if (!state.profile) { app.innerHTML = renderOnboarding(); return; }
  
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'newWorkout') app.innerHTML = renderNewWorkout();
  else if (state.screen === 'running') app.innerHTML = renderRunning();
  else if (state.screen === 'progress') app.innerHTML = renderProgress();
  else if (state.screen === 'profile') app.innerHTML = renderProfile();
}

function renderOnboarding() {
  document.getElementById('nav').style.display = 'none';
  return `<div style="max-width: 400px; margin: 40px auto; text-align:center;">
    <h1 style="font-size:44px; margin-bottom:10px;">Fitness</h1>
    <div class="card" style="text-align:left;">
      <label>Цель</label><select id="goal"><option value="mass">Набор массы</option><option value="cut">Похудение</option></select>
      <label>Пол</label><select id="sex"><option value="male">Мужской</option><option value="female">Женский</option></select>
      <label>Вес (кг)</label><input id="weight" type="number" placeholder="75">
      <label>Рост (см)</label><input id="height" type="number" placeholder="180">
      <label>Возраст</label><input id="age" type="number" placeholder="25">
      <button onclick="completeOnboarding()" style="margin-top:20px;">Начать</button>
    </div>
  </div>`;
}

function completeOnboarding() {
  const p = { 
    goal: document.getElementById('goal').value, 
    sex: document.getElementById('sex').value,
    weight: +document.getElementById('weight').value, 
    height: +document.getElementById('height').value, 
    age: +document.getElementById('age').value 
  };
  if (!p.weight || !p.height || !p.age) { alert('Заполни все поля'); return; }
  state.profile = p; save(STORAGE.profile, p);
  document.getElementById('nav').style.display = 'flex';
  render();
}

// --- ГЛАВНЫЙ ЭКРАН ---
function renderHome() {
  const done = state.workouts.some(w => w.date === today());
  const waterPct = Math.min((state.daily.water / 8) * 100, 100);
  const wPct = done ? 100 : 0;
  
  const size = 100, stroke = 10, r = (size-stroke)/2, circ = 2*Math.PI*r;

  return `
    <h1>Сводка</h1>
    <div class="bento-grid">
      <div class="card span-2" style="padding: 30px 20px;">
        <div class="rings-container">
          <div class="ring-wrap">
            <svg class="ring-svg" viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="${r}"></circle><circle class="ring-progress" cx="50" cy="50" r="${r}" style="stroke:var(--exercise); stroke-dasharray:${circ}; stroke-dashoffset:${circ - (wPct/100)*circ};"></circle></svg>
            <div class="ring-content"><i class="ph ph-barbell ring-icon" style="color:var(--exercise)"></i><span class="ring-val">${done ? '100%' : '0%'}</span></div>
          </div>
          <div class="ring-wrap">
            <svg class="ring-svg" viewBox="0 0 100 100"><circle class="ring-bg" cx="50" cy="50" r="${r}"></circle><circle class="ring-progress" cx="50" cy="50" r="${r}" style="stroke:var(--stand); stroke-dasharray:${circ}; stroke-dashoffset:${circ - (waterPct/100)*circ};"></circle></svg>
            <div class="ring-content"><i class="ph ph-drop ring-icon" style="color:var(--stand)"></i><span class="ring-val">${state.daily.water}/8</span></div>
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button class="secondary" onclick="addWater()" style="margin:0; font-size:14px; padding:12px;"><i class="ph ph-plus"></i> Вода</button>
          <button class="secondary" onclick="addCalories()" style="margin:0; font-size:14px; padding:12px;"><i class="ph ph-fork-knife"></i> Еда (${state.daily.calories})</button>
        </div>
      </div>

      <div class="card" style="min-height:180px;">
        <h2 style="margin-bottom:10px;">План тренировок</h2>
        <p class="muted">Программа на неделю</p>
        <button style="margin-top:20px;" onclick="showPlan('workout')">Смотреть план</button>
      </div>

      <div class="card" style="min-height:180px;">
        <h2 style="margin-bottom:10px;">План питания</h2>
        <p class="muted">Меню под твою цель</p>
        <button style="margin-top:20px;" onclick="showPlan('food')">Смотреть меню</button>
      </div>

      <div class="card span-2">
        <button onclick="startWorkout()" style="margin:0;"><i class="ph ph-play"></i> Начать тренировку</button>
      </div>
    </div>
  `;
}

function addWater() { state.daily.water = Math.min((state.daily.water || 0) + 1, 8); save(STORAGE.daily, state.daily); render(); }
function addCalories() { 
  const c = prompt('Сколько калорий съел?'); 
  if(c && !isNaN(c)) { state.daily.calories = (state.daily.calories || 0) + +c; save(STORAGE.daily, state.daily); render(); }
}

// --- ТРЕНИРОВКА ---
function startWorkout() {
  state.currentWorkout = { date: today(), exercises: [], mood: null, note: '' };
  state.screen = 'newWorkout';
  render();
}

function renderNewWorkout() {
  if (!state.currentWorkout) startWorkout();
  const w = state.currentWorkout;
  const tonnage = calcTonnage(w);
  
  return `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
      <h1 style="margin:0;">Зал</h1>
      <div style="background: var(--card); color: var(--exercise); padding:10px 20px; border-radius:99px; font-weight:800; font-size:18px;">${tonnage} КГ</div>
      <button class="danger" style="width:auto; padding:10px 20px; margin:0; border-radius:99px;" onclick="cancelWorkout()">Отмена</button>
    </div>

    <div class="workout-layout">
      <div>
        ${w.exercises.length > 0 ? w.exercises.map((ex, i) => `
          <div class="card" style="margin-bottom:16px; padding:20px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:16px;">
              <strong style="font-size:20px;">${ex.name}</strong>
              <div style="display:flex; gap:8px;">
                <button class="btn-icon" onclick="startTimer()"><i class="ph ph-timer"></i></button>
                <button class="btn-icon" style="color:var(--move);" onclick="removeExercise(${i})"><i class="ph ph-trash"></i></button>
              </div>
            </div>
            
            ${ex.sets.map((s, j) => `
              <div class="set-row ${s.isWarmup ? 'warmup' : ''}">
                <div class="set-num">${s.isWarmup ? 'W' : j + 1}</div>
                <input type="number" value="${s.weight}" onchange="updateSet(${i},${j},'weight',this.value)">
                <input type="number" value="${s.reps}" onchange="updateSet(${i},${j},'reps',this.value)">
                <button class="btn-icon" onclick="showPlatesFromRow(this)"><i class="ph ph-cookie"></i></button>
              </div>`).join('')}
            
            <div style="display:flex; gap:10px; margin-top:16px;">
              <button class="secondary" style="padding:12px; font-size:15px; margin:0;" onclick="addSet(${i})"><i class="ph ph-plus"></i> Подход</button>
              <button class="secondary" style="padding:12px; font-size:15px; margin:0; color:var(--move);" onclick="addWarmup(${i})"><i class="ph ph-fire"></i> Разминка</button>
            </div>
          </div>
        `).join('') : `<div class="card" style="text-align:center; padding:60px 20px; border:2px dashed var(--border); background:transparent; box-shadow:none;"><p class="muted">Добавь упражнения</p></div>`}
        
        ${w.exercises.length > 0 ? `<button onclick="promptFinishWorkout()" style="margin-top:10px;"><i class="ph ph-check-circle"></i> Завершить</button>` : ''}
      </div>

      <div>
        <div class="card" style="padding:20px; margin-bottom:16px;">
          <h2>Шаблоны</h2>
          <div style="display:flex; flex-direction:column; gap:8px;">
            ${Object.entries(TEMPLATES).map(([name, exs]) => `
              <button class="secondary" style="justify-content:space-between; padding:14px; margin:0;" onclick='applyTemplate(${JSON.stringify(exs).replace(/'/g, "&#39;")})'>
                <span>${name}</span> <i class="ph ph-caret-right"></i>
              </button>
            `).join('')}
          </div>
        </div>

        <div class="card" style="padding:20px;">
          <h2>Все упражнения</h2>
          <div style="max-height:300px; overflow-y:auto; padding-right:5px;">
            ${BASE_EXERCISES.map(ex => `<button class="secondary" style="justify-content:flex-start; padding:16px; margin-bottom:8px;" onclick="addExercise('${ex}')">${ex}</button>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
}

function applyTemplate(exs) { exs.forEach(ex => addExercise(ex, false)); render(); }
function addExercise(name, reRender = true) { state.currentWorkout.exercises.push({ name, sets: [{ weight: 0, reps: 8, isWarmup: false }] }); if (reRender) render(); }
function removeExercise(i) { state.currentWorkout.exercises.splice(i, 1); render(); }
function addSet(i) { const ex = state.currentWorkout.exercises[i]; const l = ex.sets.filter(s=>!s.isWarmup).pop() || {weight:0,reps:8}; ex.sets.push({ weight: l.weight, reps: l.reps, isWarmup: false }); render(); }
function updateSet(i, j, f, v) { state.currentWorkout.exercises[i].sets[j][f] = +v; render(); }
function addWarmup(i) { const ex = state.currentWorkout.exercises[i]; const w = ex.sets[0]?.weight || 20; ex.sets.unshift({ weight: Math.round((w*0.5)/2.5)*2.5, reps: 10, isWarmup: true }, { weight: Math.round((w*0.7)/2.5)*2.5, reps: 8, isWarmup: true }); render(); }

// --- ОЦЕНКА ТРЕНИРОВКИ ---
function promptFinishWorkout() {
  if (state.currentWorkout.exercises.length === 0) return;
  state.tempMood = null;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  document.getElementById('workout-note').value = '';
  document.getElementById('feedback-modal').classList.add('active');
}

function selectMood(emoji) {
  state.tempMood = emoji;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
}

function saveWorkoutWithFeedback() {
  const note = document.getElementById('workout-note').value;
  const total = calcTonnage(state.currentWorkout);
  
  state.workouts.push({ 
    ...state.currentWorkout, 
    id: Date.now(), 
    tonnage: total,
    mood: state.tempMood || '😐',
    note: note
  });
  
  save(STORAGE.workouts, state.workouts);
  closeModal('feedback-modal');
  state.currentWorkout = null; 
  state.screen = 'home'; 
  render();
}

function cancelWorkout() { if(confirm('Отменить тренировку?')) { state.currentWorkout = null; state.screen = 'home'; render(); } }

// --- БЕГ ---
function renderRunning() {
  const dist = ((runTime / 3600) * 9.5).toFixed(2);
  const cal = Math.round(9.8 * state.profile.weight * (runTime / 3600));
  const paceMin = runTime > 0 ? (runTime / 60) / (dist || 0.1) : 0;
  const paceStr = `${Math.floor(paceMin)}:${Math.round((paceMin%1)*60).toString().padStart(2,'0')}`;
  
  return `
    <div class="run-screen">
      <div class="run-time-big" id="run-time">${formatTime(runTime)}</div>
      <div class="run-metrics">
        <div class="run-metric-box">
          <div class="run-metric-val" id="run-dist">${dist}</div>
          <div class="stat-label">КМ</div>
        </div>
        <div class="run-metric-box">
          <div class="run-metric-val" id="run-pace" style="color:var(--stand);">${paceStr}</div>
          <div class="stat-label">ТЕМП</div>
        </div>
        <div class="run-metric-box" style="grid-column: span 2;">
          <div class="run-metric-val" id="run-cal" style="color:var(--move);">${cal}</div>
          <div class="stat-label">СОЖЖЕНО ККАЛ</div>
        </div>
      </div>
      <button onclick="toggleRun()" id="run-btn" style="border-radius:99px; padding:24px; font-size:22px; background:${runActive ? 'var(--move)' : 'var(--exercise)'}; color:${runActive ? '#fff' : '#000'};">
        <i class="ph ${runActive ? 'ph-pause' : 'ph-play'}"></i> ${runActive ? 'ПАУЗА' : 'СТАРТ'}
      </button>
      <button class="secondary" id="run-save-btn" style="display:${runActive || runTime === 0 ? 'none' : 'flex'};" onclick="saveRun(${dist}, ${cal})">
        Сохранить
      </button>
    </div>
  `;
}
function formatTime(sec) { return `${Math.floor(sec/3600).toString().padStart(2,'0')}:${Math.floor((sec%3600)/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`; }
function toggleRun() {
  runActive = !runActive;
  if(runActive) {
    runInt = setInterval(() => {
      runTime++;
      document.getElementById('run-time').innerText = formatTime(runTime);
      const d = (runTime / 3600) * 9.5;
      document.getElementById('run-dist').innerText = d.toFixed(2);
      document.getElementById('run-cal').innerText = Math.round(9.8 * state.profile.weight * (runTime / 3600));
      const p = (runTime / 60) / (d || 0.1);
      document.getElementById('run-pace').innerText = `${Math.floor(p)}:${Math.round((p%1)*60).toString().padStart(2,'0')}`;
    }, 1000);
  } else clearInterval(runInt);
  document.getElementById('run-btn').innerHTML = `<i class="ph ${runActive ? 'ph-pause' : 'ph-play'}"></i> ${runActive ? 'ПАУЗА' : 'СТАРТ'}`;
  document.getElementById('run-btn').style.background = runActive ? 'var(--move)' : 'var(--exercise)';
  document.getElementById('run-btn').style.color = runActive ? '#fff' : '#000';
  document.getElementById('run-save-btn').style.display = runActive || runTime === 0 ? 'none' : 'flex';
}
function saveRun(dist, cal) {
  state.runs.unshift({ date: today(), distance: dist, time: formatTime(runTime), calories: cal });
  save(STORAGE.runs, state.runs);
  runTime = 0; runActive = false; render();
}

// --- ТРЕНДЫ ---
function renderProgress() {
  setTimeout(drawWeightChart, 50);
  const fat = calcBodyFat(state.profile);
  const recovery = calcRecovery();
  const prs = getPRs();
  
  // Календарь текущего месяца
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay(); // 0 - Вс
  const workoutDates = state.workouts.map(w => w.date);
  let calHTML = '';
  
  for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) calHTML += `<div></div>`; // Пустые дни
  
  for (let i = 1; i <= daysInMonth; i++) {
    const dateStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
    const isDone = workoutDates.includes(dateStr);
    const isToday = i === now.getDate();
    calHTML += `<div class="cal-day ${isDone ? 'done' : ''} ${isToday ? 'today' : ''}">${i}</div>`;
  }

  return `
    <h1>Тренды</h1>
    <div class="bento-grid">
      <!-- График веса -->
      <div class="card span-2">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
          <h2>Вес тела</h2>
          <div style="display:flex; gap:10px;">
            <input id="bw" type="number" placeholder="Вес" style="width:100px; margin:0; padding:10px;">
            <button style="width:44px; height:44px; margin:0; padding:0; border-radius:12px;" onclick="logBodyWeight()"><i class="ph ph-plus"></i></button>
          </div>
        </div>
        <div style="position:relative; height:220px; width:100%; background:var(--card-light); border-radius:16px; padding:10px;">
          <canvas id="weightChart"></canvas>
        </div>
      </div>

      <!-- Календарь -->
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h2 style="margin:0;">Календарь</h2>
          <span class="muted">${now.toLocaleString('ru', {month: 'long'})}</span>
        </div>
        <div class="calendar-grid">
          ${['П','В','С','Ч','П','С','В'].map(d => `<div class="muted" style="font-size:12px; font-weight:700;">${d}</div>`).join('')}
          ${calHTML}
        </div>
      </div>

      <!-- Состав тела + Восстановление -->
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div class="card" style="padding:20px;">
          <div style="display:flex; justify-content:space-between;">
            <div>
              <div class="muted">Состав тела</div>
              <div class="stat-num" style="color:var(--stand); font-size:32px;">${fat}%</div>
            </div>
            <i class="ph ph-body" style="font-size:32px; color:var(--stand);"></i>
          </div>
        </div>
        
        <div class="card" style="padding:20px;">
          <div style="display:flex; justify-content:space-between;">
            <div>
              <div class="muted">Восстановление</div>
              <div class="stat-num" style="color:${recovery > 70 ? 'var(--accent)' : 'var(--move)'}; font-size:32px;">${recovery}%</div>
            </div>
            <i class="ph ph-battery-full" style="font-size:32px; color:${recovery > 70 ? 'var(--accent)' : 'var(--move)'};"></i>
          </div>
        </div>
      </div>

      <!-- Личные рекорды -->
      <div class="card span-2">
        <h2>Личные рекорды (1ПМ)</h2>
        <div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; margin-top:16px;">
          ${Object.entries(prs).map(([name, weight]) => `
            <div style="background:var(--card-light); padding:16px; border-radius:16px; text-align:center;">
              <div style="font-size:13px; font-weight:700; color:var(--muted); margin-bottom:8px;">${name}</div>
              <div style="font-size:24px; font-weight:800; color:var(--accent);">${weight > 0 ? weight + ' кг' : '—'}</div>
            </div>
          `).join('')}
        </div>
      </div>

    </div>`;
}

function drawWeightChart() {
  const ctx = document.getElementById('weightChart'); if (!ctx) return;
  if (state.chartInstance) state.chartInstance.destroy(); 
  const sorted = [...state.bodyLog].sort((a, b) => a.date.localeCompare(b.date));
  let gradient = ctx.getContext('2d').createLinearGradient(0, 0, 0, 250);
  gradient.addColorStop(0, 'rgba(0, 212, 255, 0.5)');
  gradient.addColorStop(1, 'rgba(0, 212, 255, 0.0)');

  state.chartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels: sorted.length ? sorted.map(b => b.date.slice(5)) : ['Нет данных'],
      datasets: [{ data: sorted.length ? sorted.map(b => b.weight) : [state.profile.weight], borderColor: '#00d4ff', backgroundColor: gradient, borderWidth: 4, tension: 0.4, fill: true, pointRadius: 4, pointBackgroundColor: '#fff' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#8e8e93' } }, x: { grid: { display: false }, ticks: { color: '#8e8e93' } } } }
  });
}
function logBodyWeight() { const w = +document.getElementById('bw').value; if (!w) return; state.bodyLog.push({ date: today(), weight: w }); save(STORAGE.bodyLog, state.bodyLog); render(); }

// --- ПРОФИЛЬ ---
function renderProfile() {
  return `
    <h1>Профиль</h1>
    <div class="card" style="text-align:center; padding:40px 24px;">
      <div style="width:100px; height:100px; border-radius:50%; background:linear-gradient(135deg, var(--move), var(--exercise)); display:flex; align-items:center; justify-content:center; font-size:48px; color:#fff; margin:0 auto 20px;">
        <i class="ph ph-user"></i>
      </div>
      <h2 style="margin-bottom:8px;">Атлет</h2>
      <button class="secondary" onclick="openMeasureModal()" style="margin-top:10px; font-size:14px; padding:10px;"><i class="ph ph-ruler"></i> Добавить замеры тела</button>
    </div>

    <div class="card">
      <h2>История тренировок</h2>
      ${state.workouts.length === 0 ? '<p class="muted">Пока нет данных</p>' : ''}
      ${[...state.workouts].sort((a,b)=>b.id-a.id).slice(0,8).map(w => `
        <div style="padding:16px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="showHistoryDetails(${w.id})">
          <div>
            <div style="font-weight:700;">${w.date}</div>
            <div class="muted" style="font-size:13px; margin-top:4px;">${w.exercises.map(e => e.name).join(', ').slice(0, 30)}...</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:24px;">${w.mood || '😐'}</span>
            <i class="ph ph-caret-right muted"></i>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="card">
      <button class="danger" onclick="resetApp()"><i class="ph ph-trash"></i> Сбросить данные</button>
    </div>`;
}

// --- МОДАЛКИ ИСТОРИИ И ЗАМЕРОВ ---
function showHistoryDetails(id) {
  const w = state.workouts.find(x => x.id === id);
  if (!w) return;
  
  document.getElementById('history-title').innerText = `Тренировка от ${w.date}`;
  document.getElementById('history-content').innerHTML = `
    <div style="text-align:center; font-size:36px; margin-bottom:20px;">${w.mood || '😐'}</div>
    ${w.note ? `<div style="background:var(--card-light); padding:16px; border-radius:16px; margin-bottom:20px; font-style:italic;">"${w.note}"</div>` : ''}
    <div style="margin-bottom:16px; font-weight:700; color:var(--accent);">Общий тоннаж: ${w.tonnage} кг</div>
    ${w.exercises.map(ex => `
      <div style="margin-bottom:16px;">
        <div style="font-weight:700; margin-bottom:8px;">${ex.name}</div>
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          ${ex.sets.map((s, i) => `<div style="background:var(--card-light); padding:8px 12px; border-radius:8px; font-size:14px; ${s.isWarmup ? 'color:var(--move)' : ''}">${s.isWarmup ? 'W' : i+1}: ${s.weight}кг × ${s.reps}</div>`).join('')}
        </div>
      </div>
    `).join('')}
  `;
  document.getElementById('history-modal').classList.add('active');
}

function openMeasureModal() {
  document.getElementById('m_chest').value = '';
  document.getElementById('m_waist').value = '';
  document.getElementById('m_bicep').value = '';
  document.getElementById('m_thigh').value = '';
  document.getElementById('measure-modal').classList.add('active');
}

function saveMeasurements() {
  const m = {
    date: today(),
    chest: +document.getElementById('m_chest').value || null,
    waist: +document.getElementById('m_waist').value || null,
    bicep: +document.getElementById('m_bicep').value || null,
    thigh: +document.getElementById('m_thigh').value || null
  };
  state.measurements.push(m); save(STORAGE.measurements, state.measurements);
  closeModal('measure-modal');
  alert('Замеры сохранены!');
}

// --- ПЛАНЫ ---
function showPlan(type) {
  const title = document.getElementById('plan-title');
  const content = document.getElementById('plan-content');
  
  if (type === 'workout') {
    title.innerText = "План тренировок (3 дня)";
    content.innerHTML = `
      <div style="margin-bottom:16px;"><b>День 1: Верх тела (Push)</b><br><span class="muted">Жим лёжа 4х8, Жим гантелей 3х10, Махи в стороны 3х15, Французский жим 3х12</span></div>
      <div style="margin-bottom:16px;"><b>День 2: Низ тела</b><br><span class="muted">Приседания 4х8, Жим ногами 3х10, Выпады 3х12, Икры 4х15</span></div>
      <div><b>День 3: Верх тела (Pull)</b><br><span class="muted">Становая тяга 3х6, Подтягивания 4хмакс, Тяга блока 3х10, Бицепс 3х12</span></div>
    `;
  } else {
    title.innerText = "План питания";
    content.innerHTML = `
      <div style="margin-bottom:16px;"><b>Твоя норма (набор массы):</b><br><span class="muted">~3000 ккал, Белки: 150г, Жиры: 80г, Углеводы: 350г</span></div>
      <div style="margin-bottom:10px;"><b>Завтрак:</b> Овсянка + 3 яйца + банан</div>
      <div style="margin-bottom:10px;"><b>Обед:</b> Гречка + Куриная грудка 200г + овощи</div>
      <div style="margin-bottom:10px;"><b>Перекус:</b> Творог 200г + орехи</div>
      <div><b>Ужин:</b> Рыба 200г + рис + салат</div>
    `;
  }
  document.getElementById('plan-modal').classList.add('active');
}

// --- УТИЛИТЫ ---
function closeModal(id) { document.getElementById(id).classList.remove('active'); if(id==='timer-modal') clearInterval(timerInt); }

function showPlatesFromRow(btn) { showPlates(+btn.parentElement.querySelector('input').value); }
function showPlates(totalWeight) {
  let target = (totalWeight - 20) / 2; const plates = [25, 20, 15, 10, 5, 2.5, 1.25]; let res = [];
  plates.forEach(p => { let count = Math.floor(target / p); if (count > 0) { res.push(`${count} × ${p} кг`); target -= count * p; } });
  document.getElementById('plates-result').innerHTML = res.length ? res.join('<br>') : "Гриф";
  document.getElementById('plates-modal').classList.add('active');
}

function startTimer() {
  document.getElementById('timer-modal').classList.add('active');
  timerTime = 90; document.getElementById('timer-display').innerText = "01:30";
  clearInterval(timerInt);
  timerInt = setInterval(() => {
    timerTime--;
    document.getElementById('timer-display').innerText = `${Math.floor(timerTime/60).toString().padStart(2,'0')}:${(timerTime%60).toString().padStart(2,'0')}`;
    if (timerTime <= 0) { clearInterval(timerInt); document.getElementById('timer-display').innerText = "СТАРТ!"; }
  }, 1000);
}

function resetApp() { if (confirm('Удалить все данные?')) { localStorage.clear(); location.reload(); } }
function go(screen) { if (screen === 'newWorkout' && !state.currentWorkout) { startWorkout(); return; } state.screen = screen; render(); window.scrollTo(0,0); }

if (state.profile) document.getElementById('nav').style.display = 'flex';
render();
</script>
</body>
</html>
