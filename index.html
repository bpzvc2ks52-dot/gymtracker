<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fitness Pro</title>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #000000; --card: #1c1c1e; --card-light: #2c2c2e;
    --text: #ffffff; --muted: #8e8e93;
    --move: #fa114f; --exercise: #a2ff00; --stand: #00d4ff; 
    --accent: #a2ff00; 
    --radius: 28px; --border: #38383a; --nav-bg: rgba(28,28,30,0.9);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); margin: 0 auto; padding: 16px 16px 110px 16px; 
    max-width: 100%; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
  
  h1 { font-size: 36px; margin: 0 0 20px; font-weight: 800; letter-spacing: -1px; }
  h2 { font-size: 22px; margin: 0 0 16px; font-weight: 700; letter-spacing: -0.5px; }
  
  button { background: var(--accent); color: #000; border: none; padding: 18px; border-radius: 20px; 
    font-size: 18px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 12px; 
    display: flex; justify-content: center; align-items: center; gap: 10px; transition: opacity 0.2s, transform 0.1s; }
  button:active { opacity: 0.7; transform: scale(0.98); }
  button.secondary { background: var(--card-light); color: var(--text); }
  button.danger { background: rgba(250,17,79,0.15); color: var(--move); }
  
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  input, select { width: 100%; padding: 18px; border-radius: 16px; border: none; 
    background: var(--card-light); color: var(--text); font-size: 17px; margin-bottom: 12px; outline: none; 
    font-family: inherit; font-weight: 600; text-align: center; }
  input:focus { box-shadow: 0 0 0 3px var(--accent); }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; padding-left: 4px;}
  
  .bento-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .card { background: var(--card); border-radius: var(--radius); padding: 24px; 
          box-shadow: 0 4px 20px rgba(0,0,0,0.2); overflow: hidden; position: relative; }
  
  .muted { color: var(--muted); font-size: 15px; font-weight: 500; }
  .stat-num { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -1.5px; }
  .stat-label { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--nav-bg);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-top: 1px solid var(--border); display: flex; justify-content: space-around;
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); z-index: 9999; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; transition: color 0.2s; width: 20%; z-index: 10000; }
  .nav-item.active { color: var(--text); }
  .nav-item.active i { color: var(--accent); }
  .nav-item i { font-size: 26px; pointer-events: none; }
  .nav-item span { pointer-events: none; }

  .rings-container { display: flex; justify-content: center; gap: 15px; padding: 10px 0; }
  .ring-wrap { position: relative; width: 90px; height: 90px; display: flex; align-items: center; justify-content: center; }
  .ring-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--card-light); stroke-width: 8; opacity: 0.3; }
  .ring-progress { fill: none; stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 1s ease-in-out; }
  .ring-content { z-index: 10; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .ring-icon { font-size: 18px; margin-bottom: 2px; }
  .ring-val { font-size: 12px; font-weight: 800; }

  .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 44px; gap: 10px; align-items: center; margin-bottom: 12px; }
  .set-num { width: 40px; height: 40px; background: var(--card-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--muted); }
  .set-row input { margin-bottom: 0; padding: 14px; font-size: 17px; border-radius: 12px; text-align: center; font-weight: 700; }
  .btn-icon { width: 44px; height: 44px; padding: 0; border-radius: 12px; background: var(--card-light); color: var(--text); border: none; display: flex; align-items: center; justify-content: center; font-size: 20px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: flex-end; justify-content: center; backdrop-filter: blur(10px); }
  .modal-overlay.active { display: flex; animation: slideUp 0.3s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-content { background: var(--card); padding: 32px 24px; border-radius: 32px 32px 0 0; max-width: 480px; width: 100%; text-align: center; max-height: 90vh; overflow-y: auto;}

  .full-calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-top: 15px;}
  .cal-day-full { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--muted); background: var(--card-light); }
  .cal-day-full.today { border: 2px solid var(--text); }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 2px; }

  .xp-container { background: var(--card-light); border-radius: 99px; height: 12px; width: 100%; overflow: hidden; margin-top: 10px; }
  .xp-fill { height: 100%; background: linear-gradient(90deg, var(--stand), var(--accent)); border-radius: 99px; transition: width 0.5s ease; }
  
  .splash-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: space-between; padding: 40px 24px; align-items: center; }
  .splash-content { display: flex; flex-direction: column; align-items: center; margin-top: 25vh; text-align: center; }
  .splash-logo { width: 90px; height: 90px; background: var(--accent); border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 44px; color: #000; margin-bottom: 24px; animation: pulse 2s infinite; }
  .splash-footer { width: 100%; max-width: 400px; text-align: center; }
  .legal { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 24px; padding: 0 10px; }
  .studio { font-size: 12px; color: var(--muted); font-weight: 800; letter-spacing: 2px; text-transform: uppercase; opacity: 0.6;}
  @keyframes pulse { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162,255,0,0.4); } 50% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(162,255,0,0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(162,255,0,0); } }

  .muscle-svg { width: 100px; height: 200px; fill: #2c2c2e; transition: fill 0.5s; }
  .chart-container { position:relative; height:220px; width:100%; background:var(--card-light); border-radius:16px; padding:10px; }

  @media (min-width: 768px) {
    body { max-width: 900px; padding: 24px 24px 40px 24px; }
    .bottom-nav { position: static; max-width: 700px; margin: 0 auto 30px auto; border-radius: 99px; border: 1px solid var(--border); padding: 8px; }
    .nav-item { flex-direction: row; width: auto; padding: 14px 28px; border-radius: 99px; font-size: 16px; gap: 10px; }
    .nav-item.active { background: var(--card); }
    .bento-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
    .span-2 { grid-column: span 2; }
    .modal-overlay { align-items: center; }
    .modal-content { border-radius: 32px; max-width: 450px; }
    .workout-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  }
</style>
</head>
<body>

<div id="splash-screen" class="splash-screen">
  <div class="splash-content">
    <div class="splash-logo"><i class="ph-bold ph-barbell"></i></div>
    <h1 style="margin-bottom:8px;">Fitness Pro</h1>
    <p class="muted">Твой персональный фитнес-трекер</p>
  </div>
  <div class="splash-footer">
    <button onclick="startApp()">Продолжить</button>
    <p class="legal">Нажимая «Продолжить», вы соглашаетесь с политикой конфиденциальности и даете согласие на обработку файлов cookie и персональных данных.</p>
    <p class="studio">Dikov studio</p>
  </div>
</div>

<div id="food-modal" class="modal-overlay" onclick="this.classList.remove('active')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <h2 style="margin-top:0">Добавить еду</h2>
    <input type="text" id="food-input" placeholder="Название и вес...">
    <button onclick="processFood()">Добавить в дневник</button>
  </div>
</div>

<nav class="bottom-nav" id="nav" style="display: none;">
  <div class="nav-item" data-screen="home" onclick="go('home')"><i class="ph ph-house"></i><span>Сводка</span></div>
  <div class="nav-item" data-screen="newWorkout" onclick="go('newWorkout')"><i class="ph ph-barbell"></i><span>Зал</span></div>
  <div class="nav-item" data-screen="progress" onclick="go('progress')"><i class="ph ph-chart-line-up"></i><span>Тренды</span></div>
  <div class="nav-item" data-screen="profile" onclick="go('profile')"><i class="ph ph-user"></i><span>Профиль</span></div>
</nav>

<div id="app" style="display:none;"></div>

<script>
  const DB_EX = { 'Приседания': 'Ноги', 'Жим лёжа': 'Грудь', 'Становая': 'Спина', 'Подтягивания': 'Спина', 'Жим гантелей': 'Грудь', 'Тяга блока': 'Спина' };
const DB_FOOD = { 'творог': 180, 'курица': 165, 'яйцо': 155, 'овсянка': 350, 'банан': 89, 'рис': 344, 'шаурма': 250, 'пицца': 266, 'борщ': 50, 'котлета': 260, 'бургер': 295, 'суши': 150, 'яблоко': 52, 'кофе': 2 };
const INJURY_MAP = { 'Колено': ['Приседания'], 'Поясница': ['Становая'], 'Плечо': ['Жим лёжа', 'Жим гантелей'] };

let state = {
  profile: JSON.parse(localStorage.getItem('p')) || { weight: 75, height: 180, age: 25, goal: 'mass', xp: 0, level: 1, injuries: [] },
  daily: JSON.parse(localStorage.getItem('d')) || { date: new Date().toISOString().slice(0,10), calories: 0, water: 0 },
  workouts: JSON.parse(localStorage.getItem('w')) || [],
  bodyLog: JSON.parse(localStorage.getItem('b')) || [],
  currentWorkout: null,
  screen: 'home'
};

function startApp() {
  document.getElementById('splash-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('nav').style.display = 'flex';
  render();
}

function save() {
  localStorage.setItem('p', JSON.stringify(state.profile));
  localStorage.setItem('d', JSON.stringify(state.daily));
  localStorage.setItem('w', JSON.stringify(state.workouts));
  localStorage.setItem('b', JSON.stringify(state.bodyLog));
}

function addXP(amount) {
  state.profile.xp = (state.profile.xp || 0) + amount;
  state.profile.level = Math.floor(state.profile.xp / 500) + 1;
  save();
}

function getTargets() {
  const p = state.profile;
  let bmr = 10 * p.weight + 6.25 * p.height - 5 * p.age + 5;
  let cal = Math.round(bmr * 1.5 + (p.goal === 'mass' ? 400 : -400));
  return { cal, protein: Math.round(p.weight * 1.8) };
}

function getAllEx() { return DB_EX; }
function getLastWeight(exName) {
  const sorted = [...state.workouts].sort((a,b) => b.date.localeCompare(a.date));
  for (let w of sorted) {
    const found = w.exercises.find(e => e.name === exName);
    if (found && found.sets.length > 0) return found.sets[0].weight;
  }
  return null;
}

function render() {
  const app = document.getElementById('app');
  document.querySelectorAll('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.screen === state.screen));
  
  if (state.screen === 'home') app.innerHTML = renderHome();
  else if (state.screen === 'newWorkout') app.innerHTML = renderWorkout();
  else if (state.screen === 'progress') app.innerHTML = renderProgress();
  else if (state.screen === 'profile') app.innerHTML = renderProfile();
}

function renderHome() {
  const t = getTargets();
  const done = state.workouts.some(w => w.date === new Date().toISOString().slice(0,10));
  const wPct = done ? 100 : 0;
  const waterPct = Math.min((state.daily.water / 8) * 100, 100);
  const size = 90, stroke = 8, r = (size-stroke)/2, circ = 2*Math.PI*r;

  return `
    <h1>Сводка</h1>
    <div class="bento-grid">
      <div class="card span-2" style="padding: 30px 15px;">
        <div class="rings-container">
          <div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 90 90"><circle class="ring-bg" cx="45" cy="45" r="${r}"></circle><circle class="ring-progress" cx="45" cy="45" r="${r}" style="stroke:var(--exercise); stroke-dasharray:${circ}; stroke-dashoffset:${circ - (wPct/100)*circ};"></circle></svg><div class="ring-content"><i class="ph ph-barbell ring-icon" style="color:var(--exercise)"></i><span class="ring-val">${done ? '100%' : '0%'}</span></div></div>
          <div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 90 90"><circle class="ring-bg" cx="45" cy="45" r="${r}"></circle><circle class="ring-progress" cx="45" cy="45" r="${r}" style="stroke:var(--stand); stroke-dasharray:${circ}; stroke-dashoffset:${circ - (waterPct/100)*circ};"></circle></svg><div class="ring-content"><i class="ph ph-drop ring-icon" style="color:var(--stand)"></i><span class="ring-val">${state.daily.water}/8</span></div></div>
        </div>
        <div style="background:var(--card-light); padding:16px; border-radius:16px; margin-top:20px; display:flex; justify-content:space-between; text-align:center;">
          <div><div style="font-size:18px; font-weight:800; color:var(--accent);">${state.daily.calories}</div><div class="muted" style="font-size:11px;">/ ${t.cal} ККАЛ</div></div>
          <div><div style="font-size:18px; font-weight:800;">${t.protein}</div><div class="muted" style="font-size:11px;">БЕЛОК (г)</div></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;">
          <button class="secondary" onclick="addWater()" style="margin:0; font-size:14px; padding:14px;"><i class="ph ph-plus"></i> Вода</button>
          <button class="secondary" onclick="document.getElementById('food-modal').classList.add('active')" style="margin:0; font-size:14px; padding:14px;"><i class="ph ph-fork-knife"></i> Еда</button>
        </div>
      </div>
      <div class="card span-2">
        <button onclick="startWorkout()" style="margin:0;"><i class="ph ph-play"></i> Начать тренировку</button>
      </div>
    </div>
  `;
}

function addWater() { state.daily.water++; save(); render(); }

function processFood() {
  const input = document.getElementById('food-input').value.toLowerCase();
  let found = false;
  for (let key in DB_FOOD) {
    if (input.includes(key)) {
      const weight = input.match(/(\d+)/) ? parseInt(input.match(/(\d+)/)[1]) : 100;
      state.daily.calories += Math.round(DB_FOOD[key] * (weight / 100));
      found = true; break;
    }
  }
  if(!found) alert('Продукт не найден.');
  else { document.getElementById('food-modal').classList.remove('active'); document.getElementById('food-input').value = ''; addXP(10); save(); render(); }
}

function startWorkout() {
  state.currentWorkout = { exercises: [] };
  state.screen = 'newWorkout';
  render();
}

function renderWorkout() {
  if (!state.currentWorkout) startWorkout();
  const w = state.currentWorkout;
  return `
    <h1>Тренировка</h1>
    ${w.exercises.map((ex, i) => `
      <div class="card">
        <h2>${ex.name}</h2>
        ${ex.sets.map((s, j) => `
          <div class="set-row">
            <div class="set-num">${j+1}</div>
            <input type="number" value="${s.weight}" onchange="updSet(${i},${j},'weight',this.value)" placeholder="кг">
            <input type="number" value="${s.reps}" onchange="updSet(${i},${j},'reps',this.value)" placeholder="повт">
            <button class="btn-icon" onclick="showPlates(${s.weight})"><i class="ph ph-cookie"></i></button>
          </div>
        `).join('')}
        <button class="secondary" style="padding:8px; font-size:14px;" onclick="addSet(${i})">+ Подход</button>
      </div>
    `).join('')}
    
    <div class="card">
      <h2>Упражнения</h2>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
        ${Object.keys(DB_EX).map(ex => {
          const last = getLastWeight(ex);
          return `<button class="secondary" style="padding:10px; font-size:14px; flex-direction:column; gap:2px;" onclick="addEx('${ex}')">
            <div>${ex}</div>
            ${last ? `<div class="muted" style="font-size:10px; color:var(--accent);">Прошлый раз: ${last}кг</div>` : ''}
          </button>`;
        }).join('')}
      </div>
    </div>

    ${w.exercises.length > 0 ? `<button onclick="finishWorkout()"><i class="ph ph-check"></i> Завершить</button>` : ''}
    <button class="danger" onclick="cancelWorkout()">Отмена</button>
  `;
}

function addEx(name) {
  const injuries = state.profile.injuries || [];
  if (INJURY_MAP[injuries[0]]?.includes(name)) {
    if(!confirm(`Внимание! У вас травма. Это упражнение опасно. Всё равно добавить?`)) return;
  }
  const last = getLastWeight(name);
  state.currentWorkout.exercises.push({ name, sets: [{ weight: last ? last : 0, reps: 8 }] });
  render();
}
function addSet(i) {
  const last = state.currentWorkout.exercises[i].sets.slice(-1)[0];
  state.currentWorkout.exercises[i].sets.push({ weight: last.weight, reps: last.reps });
  render();
}
function updSet(i, j, f, v) { state.currentWorkout.exercises[i].sets[j][f] = +v; }
function cancelWorkout() { state.currentWorkout = null; state.screen = 'home'; render(); }
function finishWorkout() {
  let ton = 0;
  state.currentWorkout.exercises.forEach(ex => ex.sets.forEach(s => ton += s.weight * s.reps));
  state.workouts.push({ date: new Date().toISOString().slice(0,10), exercises: state.currentWorkout.exercises, tonnage: ton });
  state.currentWorkout = null; state.screen = 'home'; addXP(100); save(); render();
}

function showPlates(w) {
  if (w <= 20) { alert("Вес пустого грифа (20 кг)"); return; }
  let target = (w - 20) / 2;
  const plates = [25, 20, 15, 10, 5, 2.5, 1.25];
  let res = [];
  plates.forEach(p => { let count = Math.floor(target / p); if (count > 0) { res.push(`${count} × ${p} кг`); target -= count * p; } });
  alert(`На каждую сторону:\n` + (res.length ? res.join('\n') : 'Гриф'));
}

function renderProgress() {
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  
  let calHTML = '';
  for (let i = 0; i < offset; i++) calHTML += `<div></div>`;
  for (let i = 1; i <= daysInMonth; i++) {
    const dStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${i.toString().padStart(2,'0')}`;
    const isW = state.workouts.some(w => w.date === dStr);
    calHTML += `<div class="cal-day-full ${i === now.getDate() ? 'today' : ''}">${i} ${isW ? '<div class="cal-dot"></div>' : ''}</div>`;
  }

  return `
    <h1>Тренды</h1>
    <div class="bento-grid">
      <div class="card span-2">
        <h2>Календарь</h2>
        <div class="full-calendar">
          ${['П','В','С','Ч','П','С','В'].map(d => `<div class="muted" style="font-size:12px; font-weight:700;">${d}</div>`).join('')}
          ${calHTML}
        </div>
      </div>
      <div class="card span-2">
        <h2>Вес тела</h2>
        <div style="display:flex; gap:10px;">
          <input type="number" id="bw" placeholder="Текущий вес">
          <button class="secondary" style="width:60px; margin:0;" onclick="addWeight()">+</button>
        </div>
        <div class="muted" style="margin-top:10px;">Записей: ${state.bodyLog.length}</div>
      </div>
    </div>
  `;
}

function addWeight() {
  const w = +document.getElementById('bw').value;
  if(w) { state.bodyLog.push({ date: new Date().toISOString().slice(0,10), weight: w }); addXP(20); save(); render(); }
}

function renderProfile() {
  const xp = state.profile.xp || 0;
  const level = state.profile.level || 1;
  return `
    <h1>Профиль</h1>
    <div class="card">
      <h2>Атлет <span style="color:var(--accent); font-size:16px;">Ур. ${level}</span></h2>
      <div class="xp-container"><div class="xp-fill" style="width: ${Math.min((xp % 500) / 5, 100)}%;"></div></div>
      <div class="muted" style="font-size:12px; margin-top:6px; text-align:right;">XP: ${xp}</div>
    </div>
    <div class="card">
      <h2>Данные</h2>
      <label>Вес (кг)</label><input type="number" value="${state.profile.weight}" onchange="updProf('weight', this.value)">
      <label>Рост (см)</label><input type="number" value="${state.profile.height}" onchange="updProf('height', this.value)">
      <label>Цель</label>
      <select onchange="updProf('goal', this.value)">
        <option value="mass" ${state.profile.goal === 'mass' ? 'selected' : ''}>Набор массы</option>
        <option value="cut" ${state.profile.goal === 'cut' ? 'selected' : ''}>Похудение</option>
      </select>
      <label>Травмы (через запятую)</label>
      <input type="text" value="${state.profile.injuries?.join(', ') || ''}" placeholder="Колено, Поясница" onchange="state.profile.injuries = this.value.split(',').map(s=>s.trim()); save();">
    </div>
    <div class="card">
      <h2>История</h2>
      ${state.workouts.map(w => `<div style="padding:10px 0; border-bottom:1px solid var(--border); display:flex; justify-content:space-between;"><span>${w.date}</span> <b>${w.tonnage} кг</b></div>`).join('') || '<p class="muted">Пока пусто</p>'}
    </div>
    <button class="danger" onclick="if(confirm('Удалить все?')) { localStorage.clear(); location.reload(); }">Сбросить данные</button>
  `;
}

function updProf(f, v) { state.profile[f] = f === 'goal' ? v : +v; save(); render(); }
function go(screen) { if (screen === 'newWorkout' && !state.currentWorkout) { startWorkout(); return; } state.screen = screen; render(); window.scrollTo(0,0); }
render();
</script>
</body>
</html>
